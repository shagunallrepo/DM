<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M D International School - Portal Login</title>
    <style>
        :root {
            --school-red: #da291c;
            --school-dark: #121826;
            --card-bg: rgba(255, 255, 255, 0.88);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f141d;
            overflow: hidden;
            position: relative;
            padding: 1.5rem;
        }

        /* Continuous Floating Ambient Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            background: #da291c;
            top: 10%;
            left: 15%;
            animation: driftOne 12s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 380px;
            height: 380px;
            background: #ff5b4d;
            bottom: 10%;
            right: 15%;
            animation: driftTwo 14s ease-in-out infinite alternate;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: #3b82f6;
            bottom: 40%;
            left: 30%;
            animation: driftThree 10s ease-in-out infinite alternate;
            opacity: 0.25;
        }

        @keyframes driftOne {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 60px) scale(1.15); }
            100% { transform: translate(-40px, 100px) scale(0.9); }
        }

        @keyframes driftTwo {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-70px, -50px) scale(1.2); }
            100% { transform: translate(50px, -80px) scale(0.95); }
        }

        @keyframes driftThree {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, -60px) scale(1.2); }
        }

        /* Glassmorphic Login Card */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
            padding: 2.5rem 2rem;
            animation: cardEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo Floating Animation */
        .logo-wrap {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-wrap img {
            max-width: 210px;
            height: auto;
            animation: gentleFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.1));
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .login-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-title h2 {
            color: var(--school-dark);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-title p {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        /* Animated Input Groups */
        .input-group {
            margin-bottom: 1.4rem;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            transition: color 0.3s ease;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group input:focus {
            border-color: var(--school-red);
            box-shadow: 0 0 0 4px rgba(218, 41, 28, 0.15);
            transform: translateY(-1px);
        }

        /* Animated Glowing Button */
        .btn-submit {
            position: relative;
            width: 100%;
            padding: 0.95rem;
            margin-top: 0.8rem;
            background: linear-gradient(135deg, #da291c 0%, #b81f14 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(218, 41, 28, 0.35);
            transition: all 0.3s ease;
        }

        /* Light sweep shimmer effect across button */
        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(25deg);
            animation: shimmer 3.5s infinite;
        }

        @keyframes shimmer {
            0% { left: -60%; }
            30% { left: 130%; }
            100% { left: 130%; }
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(218, 41, 28, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Bottom helper links */
        .card-footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .card-footer a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .card-footer a:hover {
            color: var(--school-red);
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Background Elements -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <!-- Login Container -->
    <div class="login-card">
        <div class="logo-wrap">
            <img src="1000009874.jpg" alt="M D International School Logo">
        </div>

        <div class="login-title">
            <h2>School Portal</h2>
            <p>Enter your credentials to continue</p>
        </div>

        <form action="/login-endpoint" method="POST">
            <div class="input-group">
                <label for="email">Student / Employee ID</label>
                <input type="text" id="email" name="email" required placeholder="e.g. STU-2024-001">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Sign In</button>

            <div class="card-footer">
                <a href="#">Forgot password?</a>
                <a href="#">Contact Administration</a>
            </div>
        </form>
    </div>

</body>
</html>
