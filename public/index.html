<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M D International School - Academic Portal</title>
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #da291c;
            --primary-hover: #b81f14;
            --primary-glow: rgba(218, 41, 28, 0.4);
            --bg-dark: #070a10;
            /* Translucent Glass Surface */
            --surface: rgba(12, 18, 32, 0.38);
            --surface-border: rgba(255, 255, 255, 0.18);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --input-bg: rgba(7, 12, 22, 0.42);
            --input-border: rgba(255, 255, 255, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 1.25rem 1rem;
            color: var(--text-main);
        }

        /* 1. School Photo Background Layer */
        .school-bg {
            position: fixed;
            inset: 0;
            background: url('1000009902.jpg') no-repeat center center / cover;
            z-index: 0;
            transform: scale(1.02);
        }

        /* 2. Soft Tint Scrim Overlay to Balance Background Exposure */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(6, 10, 18, 0.45) 0%, rgba(4, 7, 14, 0.72) 100%);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 1;
        }

        /* 3. Interactive Particles Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Ambient Glow Spheres */
        .ambient-glow {
            position: fixed;
            width: min(520px, 90vw);
            height: min(520px, 90vw);
            background: radial-gradient(circle, rgba(218, 41, 28, 0.25) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
            filter: blur(55px);
        }

        /* 4. Login Card Perspective Container */
        .card-perspective-wrapper {
            z-index: 10;
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        /* Translucent Frosted Glass Card */
        .login-card {
            position: relative;
            background: var(--surface);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border-radius: 24px;
            border: 1px solid var(--surface-border);
            padding: 2.2rem 1.8rem;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.65), 
                0 0 35px -10px var(--primary-glow),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.25);
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        /* Desktop-only 3D Tilt */
        @media (hover: hover) and (pointer: fine) {
            .card-perspective-wrapper {
                perspective: 1200px;
            }
            .login-card {
                transform-style: preserve-3d;
                transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.85rem 1.35rem;
                border-radius: 22px;
            }
        }

        /* Spotlight Hover Glow */
        .card-spotlight {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(350px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(218, 41, 28, 0.18), transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        /* Logo Badge */
        .logo-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .logo-badge {
            background: #ffffff;
            padding: 10px 18px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(218, 41, 28, 0.25);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: gentleFloat 4s ease-in-out infinite;
        }

        .logo-badge img {
            max-width: 190px;
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Header Info */
        .header-title {
            text-align: center;
            margin-bottom: 1.35rem;
        }

        .header-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .header-title p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 3px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        /* Translucent Role Switcher Tabs */
        .role-switch {
            display: flex;
            position: relative;
            background: rgba(6, 10, 18, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.35rem;
            backdrop-filter: blur(10px);
        }

        .role-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(33.333% - 4px);
            background: var(--primary);
            border-radius: 9px;
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 2px 10px rgba(218, 41, 28, 0.45);
            z-index: 1;
        }

        .role-btn {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: color 0.25s ease;
        }

        .role-btn.active {
            color: #ffffff;
        }

        /* Translucent Form Inputs */
        .input-group {
            position: relative;
            margin-bottom: 1.15rem;
        }

        .input-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            pointer-events: none;
            transition: stroke 0.25s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(218, 41, 28, 0.25);
            background: rgba(10, 16, 28, 0.6);
        }

        .input-wrapper:focus-within .input-icon {
            stroke: var(--primary);
        }

        /* Password Toggle */
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            transition: stroke 0.2s ease;
        }

        .toggle-password:hover svg {
            stroke: #ffffff;
        }

        /* Options */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 1.35rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .remember-me input {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-link {
            color: #ff5b4d;
            text-decoration: none;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            position: relative;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #e43326 0%, #b31d12 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(218, 41, 28, 0.45);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-20deg);
            animation: buttonGlint 4s infinite;
        }

        @keyframes buttonGlint {
            0%, 75% { left: -100%; }
            100% { left: 200%; }
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(218, 41, 28, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* 6. Enter As A Guest Button */
        .btn-guest {
            position: relative;
            width: 100%;
            padding: 12px;
            margin-top: 0.8rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.86rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-guest svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            transition: stroke 0.2s ease;
        }

        .btn-guest:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        }

        .btn-guest:hover svg {
            stroke: #ffffff;
        }

        .btn-guest:active {
            transform: translateY(0);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        .card-bottom {
            margin-top: 1.35rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .card-bottom a {
            color: #ffffff;
            text-decoration: none;
        }

        .card-bottom a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 1. School Photo Background Layer -->
    <div class="school-bg"></div>

    <!-- 2. Translucent Tint Scrim -->
    <div class="bg-overlay"></div>

    <!-- 3. Animated Particles Canvas -->
    <canvas id="particle-canvas"></canvas>
    <div class="ambient-glow"></div>

    <!-- 4. Translucent Login Card -->
    <div class="card-perspective-wrapper">
        <div class="login-card" id="tilt-card">
            <div class="card-spotlight" id="card-spotlight"></div>
            
            <div class="card-content">
                <!-- School Logo Badge -->
                <div class="logo-box">
                    <div class="logo-badge">
                        <img id="schoolLogo" src="1000009874.jpg" alt="M D International School Logo">
                    </div>
                </div>

                <div class="header-title">
                    <h1>M D International School</h1>
                    <p>Academic & Administration Portal</p>
                </div>

                <!-- Role Selector -->
                <div class="role-switch">
                    <div class="role-indicator" id="role-indicator"></div>
                    <button type="button" class="role-btn active" onclick="selectRole(0, 'Student')">Student</button>
                    <button type="button" class="role-btn" onclick="selectRole(1, 'Teacher')">Teacher</button>
                    <button type="button" class="role-btn" onclick="selectRole(2, 'Admin')">Admin</button>
                </div>

                <!-- Form -->
                <form id="loginForm" action="/login-endpoint" method="POST">
                    <input type="hidden" name="role" id="selected-role" value="Student">

                    <!-- ID Input -->
                    <div class="input-group">
                        <label class="input-label" id="id-label">Student ID or Email</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" name="identifier" id="identifierInput" required placeholder="e.g. STU-2026-001" autocomplete="username">
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <label class="input-label">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" name="password" id="passwordInput" required placeholder="••••••••••••" autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Keep me signed in</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <span class="btn-text">Authenticate & Sign In</span>
                        <div class="spinner"></div>
                    </button>

                    <!-- Enter As A Guest Button -->
                    <button type="button" class="btn-guest" id="guestBtn" onclick="enterAsGuest()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        <span>ENTER AS A GUEST</span>
                    </button>

                    <!-- Footer -->
                    <div class="card-bottom">
                        <p>© 2026 M D International School • <a href="#">IT Support</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        /* ================= 0. LOGO AUTO-LOADER ================= */
        const logoImg = document.getElementById('schoolLogo');
        fetch('MD International School Logo (3).html')
            .then(res => res.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const img = doc.querySelector('img');
                if (img && img.src) logoImg.src = img.src;
            })
            .catch(() => {
                logoImg.src = '1000009874.jpg';
            });

 
/* ================= 1. GUEST LOGIN HANDLER ================= */
function enterAsGuest() {
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) submitBtn.classList.add('loading');
    
    // Redirect directly to the School Portal Home Page
    window.location.href = 'home.html';
}
        /* ================= 2. CANVAS PARTICLES ================= */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        let mouse = { x: null, y: null, radius: 120 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        let particles = [];
        const isMobile = window.innerWidth <= 768;
        const particleCount = isMobile ? 30 : Math.floor((width * height) / 18000);

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.radius = Math.random() * 1.8 + 1;
                this.color = Math.random() > 0.35 ? 'rgba(218, 41, 28,' : 'rgba(255, 255, 255,';
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color + ' 0.5)';
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                if (mouse.x !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        this.x -= (dx / dist) * force * 2.5;
                        this.y -= (dy / dist) * force * 2.5;
                    }
                }

                this.draw();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {
                        let alpha = 1 - (dist / 100);
                        ctx.strokeStyle = `rgba(218, 41, 28, ${alpha * 0.22})`;
                        ctx.lineWidth = 0.7;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            particles.forEach(p => p.update());
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        /* ================= 3. DESKTOP-ONLY 3D TILT ================= */
        const card = document.getElementById('tilt-card');
        const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        if (canHover) {
            document.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);

                const cardCenterX = rect.left + rect.width / 2;
                const cardCenterY = rect.top + rect.height / 2;
                const deltaX = (e.clientX - cardCenterX) / 28;
                const deltaY = (e.clientY - cardCenterY) / 28;

                const rotX = Math.max(Math.min(-deltaY, 6), -6);
                const rotY = Math.max(Math.min(deltaX, 6), -6);

                card.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            });

            window.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            });
        }

        /* ================= 4. ROLE SELECTOR ================= */
        function selectRole(index, roleName) {
            const indicator = document.getElementById('role-indicator');
            const buttons = document.querySelectorAll('.role-btn');
            const idLabel = document.getElementById('id-label');
            const roleInput = document.getElementById('selected-role');

            indicator.style.transform = `translateX(${index * 100}%)`;
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            roleInput.value = roleName;

            if (roleName === 'Student') {
                idLabel.textContent = 'Student ID or Email';
            } else if (roleName === 'Teacher') {
                idLabel.textContent = 'Staff / Faculty ID';
            } else {
                idLabel.textContent = 'Administrator ID';
            }
        }

        /* ================= 5. SHOW / HIDE PASSWORD ================= */
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerHTML = `
